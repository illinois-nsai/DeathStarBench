name: memcached-rate

ports:
  - port: 11212
    targetPort: 11211
 
container:
  image: memcached
  imageVersion: latest
  name: hotel-reserv-rate-mmc
  ports:
  - containerPort: 11211

nodeSelector:
  type: stateful

# Let Prometheus scrape the memcached-exporter sidecar.
annotations: |
  prometheus.io/scrape: "true"
  prometheus.io/port: "9150"
