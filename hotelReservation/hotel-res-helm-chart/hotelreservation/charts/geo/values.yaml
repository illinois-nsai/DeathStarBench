name: geo

replicas: 1

ports:
  - port: 8083
    targetPort: 8083
 
container:
  command: /go/bin/geo
  image: htliang/hotelreservation-new-rate
  name: hotel-reserv-geo
  ports:
  - containerPort: 8083

  resources: |
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 1000m
      memory: 1024Mi

configMaps:
  - name: service-config.json
    mountPath: config.json
    value: service-config

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: type
          operator: NotIn
          values:
          - stateful
