name: reservation

replicas: 1

ports:
  - port: 8087
    targetPort: 8087
 
container:
  command: /go/bin/reservation
  image: htliang/hotelreservation-remove-consul
  name: hotel-reserv-reservation
  ports:
  - containerPort: 8087

  resources: |
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 1000m
      memory: 1024Mi

configMaps:
  - name: service-config.json
    mountPath: config.json
    value: service-config


affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: type
          operator: NotIn
          values:
          - stateful