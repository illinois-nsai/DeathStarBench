name: memcached-reserve

ports:
  - port: 11214
    targetPort: 11211
 
container:
  image: memcached
  imageVersion: latest
  name: hotel-reserv-reservation-mmc
  ports:
  - containerPort: 11211
  # Passed as flags, not env vars: the official memcached image ignores
  # MEMCACHED_* (a Bitnami convention), so the previous env-based settings never
  # reached the process. 64 MiB / 4 threads are memcached's own defaults and are
  # what every sweep through 9/15 actually ran, verified from the exporter
  # (memcached_limit_bytes=67108864). Stated explicitly so the chart matches
  # reality and a future change here is visible rather than silently dropped.
  args:
  - "-m"
  - "64"
  - "-t"
  - "4"


nodeSelector:
  type: stateful

# Keep this one memcached out of the service mesh.
#
# It is the hottest datastore on the search and reserve paths: CheckAvailability
# issues a ~130-key multiget per request. With a sidecar in front, envoy burned
# 650 millicores against memcached's own 204 and writes into it timed out.
#
# The cost is that istio_tcp_*_bytes_total no longer covers the
# reservation -> memcached-reserve edge. mongodb and the other two memcached
# instances stay in the mesh.
annotations: |
  sidecar.istio.io/inject: "false"
  prometheus.io/scrape: "true"
  prometheus.io/port: "9150"
