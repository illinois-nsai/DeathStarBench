global:
  nameOverride: ""
  fullnameOverride: ""
  mainChart: hotelres
  replicas: 1
  # IfNotPresent, not Always: the image is built locally and imported straight
  # into containerd on each node, so there is no registry to pull it from.
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  dockerRegistry: docker.io
  defaultImageVersion: latest
  serviceDnsDomain: "cluster.local"
  services:
    environments:
      # TLS enablement
      #  - 0: Disable
      #  - 1: Enabled, using default cipher suite based on golang runtime
      #  - TLS_XXX: Enabled, using the specified Cipher suite, see tls/options.go#L22
      TLS: 0
      LOG_LEVEL: "INFO"
      JAEGER_SAMPLE_RATIO: "0.05"
      MEMC_TIMEOUT: "2"
      GC: "100"
  affinity: {}
  tolerations: []
  nodeSelector: {}
  memcached:
    HACount: 1
    # Scraped by the existing kubernetes-pods Prometheus job, which keeps any pod
    # carrying prometheus.io/scrape - so no scrape-config change is needed. The
    # per-chart annotations set that; see charts/memcached-*/values.yaml.
    exporter:
      image: prom/memcached-exporter
      imageVersion: v0.14.2
      port: 9150
      resources: |
        limits:
          cpu: 200m
          memory: 64Mi
        requests:
          cpu: 50m
          memory: 32Mi
    # No `environments:` block here on purpose. MEMCACHED_CACHE_SIZE and
    # MEMCACHED_THREADS were set at this level and were silently inert: this
    # chart runs the OFFICIAL memcached image, whose entrypoint does not turn
    # environment variables into flags - that is a Bitnami convention. So every
    # experiment up to and including the 9/15 sweep ran memcached at its built-in
    # defaults no matter what was declared here. Read back from the exporter
    # mid-sweep, on all three instances:
    #
    #   memcached_limit_bytes     = 67108864   (64 MiB, not the declared 128)
    #   memcached_max_connections = 1024       (the default)
    #
    # Sizing now goes through `args` on each memcached chart, which the image
    # does honour. Those values are 64 MiB / 4 threads - deliberately the
    # defaults that were already in force, so the chart now states what actually
    # runs without changing behaviour or invalidating the existing sweeps.
  mongodb:
    persistentVolume:               # use hostPath or pvprovisioner
      enabled: false
      size: "1Gi"
      hostPath:
        enabled: false
        path: /tmp
      pvprovisioner:
        enabled: false
        storageClassName: ceph-fs   # optional
consul:
  enabled: false
  # resources: |
  #   requests:
  #     cpu: "100m"
  #     memory: "128Mi"
